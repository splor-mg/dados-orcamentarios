name: dados_classificadores
title: Tabelas Auxiliares de Classificadores
owner_org: secretaria-de-estado-de-planejamento-e-gestao-seplag
dpetl_load:
  owner: splor-mg
  repo: dados-classificadores
  level: orgs
resources:
  - name: acao
    type: table
    path: ['data_raw/acao_previous.csv', 'data_raw/acao_current.csv']
    scheme: multipart
    format: csv
    mediatype: text/csv
    encoding: utf-8
    dialect: schemas/dialect.yaml
    schema: schemas/acao.yaml
    dpetl_extract:
      mode: cli
      arguments:
        - bo export AID-SPLOR/dados_classificadores/current/acao -q --dp DP8 -o datapackages/dados_classificadores/data_raw/acao_current.csv
        - bo export AID-SPLOR/dados_classificadores/previous/acao -q --dp DP3 -o datapackages/dados_classificadores/data_raw/acao_previous.csv
    dpetl_transform:
      format: csv

