    type: table
    path: ['data_raw/acao_previous.csv', 'data_raw/acao_current.csv']
    scheme: multipart
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema: schemas/acao.yaml
    dpetl_extract:
      mode: email
      mailbox: '[Gmail]/Trash'
    dpetl_transform:
      format: csv

