name: dados_ppo
title: Portal de Planejamento e Orçamento - PPO-MG
owner_org: secretaria-de-estado-de-planejamento-e-gestao-seplag
dpetl_extract: false
dpetl_load:
  owner: splor-mg
  repo: dados-ppo-{{year1}}
  level: orgs
  visibility: public

custom:
  - sources:
    - id: relatorios
      source: https://github.com/splor-mg/regras-orcamentarias-mg/tree/main/rules/DCAF/relatorios
  - flows:
    - id: receita
      rules:
        - is_asps_rec
        - is_ibs
        - is_icms
        - is_ipva
        - is_irrf
        - is_itcd
        - is_fpe_principal
        - is_ipi_principal
        - is_lei_kandir_principal
    - id: despesa
      rules:
        - is_asps_desp

resources:
  - name: intra_orcamentaria
    type: table
    path: data_raw/Despesa_Intraorcamentaria_{{year1}}.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    dialect:
      delimiter: ';'
    schema: schemas/intra_orcamentaria.yaml
    dpetl_transform:
      path: data_pre
      format: csv

  - name: orcamento_despesa
    type: table
    path: data_raw/Despesa_Orcamentaria_Fiscal_{{year1}}.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    dialect:
      delimiter: ';'
    schema: schemas/orcamento_despesa.yaml
    dpetl_transform:
      cli:
        stdin: true
        arguments:
          - zendt flow despesa -o datapackages/dados_ppo/data_pre/orcamento_despesa.csv

  - name: orcamento_despesa_investimento
    type: table
    path: data_raw/Despesa_Investimento_{{year1}}.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    dialect:
      delimiter: ';'
    schema: schemas/orcamento_despesa_investimento.yaml
    dpetl_transform:
      path: data_pre
      format: csv

  - name: orcamento_limite
    type: table
    path: data_raw/Limite Orçamentário.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    dialect:
