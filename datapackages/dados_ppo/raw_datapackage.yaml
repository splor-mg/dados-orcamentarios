name: dados_ppo
title: Portal de Planejamento e Orçamento - PPO-MG
owner_org: secretaria-de-estado-de-planejamento-e-gestao-seplag
dpetl_load:
  owner: splor-mg
  repo: dados-ppo-{{year1}}
  level: orgs
  visibility: public

custom:
  - sources:
    - id: relatorios
      source: https://github.com/splor-mg/regras-orcamentarias-mg/tree/main/rules/DCAF/relatorios
  - flows:
    - id: receita
      rules:
        - is_asps_rec
        - is_ibs
        - is_icms
        - is_ipva
        - is_irrf
        - is_itcd
        - is_fpe_principal
        - is_ipi_principal
        - is_lei_kandir_principal
    - id: despesa
      rules:
        - is_asps_desp

resources:
  - name: classificacao_despesa
    type: table
    path: data/classificacao_despesa.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema: schemas/classificacao_despesa.yaml
    dpetl_extract:
      mode: sql
    dpetl_transform: false

  - name: classificacao_fonte
    type: table
    path: data/classificacao_fonte.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema: schemas/classificacao_fonte.yaml
    dpetl_extract:
      mode: sql
    dpetl_transform: false

