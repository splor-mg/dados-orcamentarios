name: dados_siafi
title: Sistema Integrado de Administração Financeira – SIAFI 2026
owner_org: secretaria-de-estado-de-planejamento-e-gestao-seplag
dpetl_load:
  owner: splor-mg
  repo: dados-siafi-2026
  level: orgs
resources:

  - name: restos_pagar
    type: table
    path: ['data_raw/restos_pagar_01.csv', 'data_raw/restos_pagar_02.csv']
    scheme: multipart
    format: csv
    mediatype: text/csv
    encoding: utf-8
    dialect: schemas/dialect.yaml
    schema: schemas/restos_pagar.yaml
    dpetl_extract:
      mode: cli
      arguments:
        - bo export AID-SPLOR/dados_siafi/current/restos_pagar -q -p "Ano de Exercício=2026" -p "Mês - Numérico=1" -o datapackages/dados_siafi/data_raw/restos_pagar_01.csv
        - bo export AID-SPLOR/dados_siafi/current/restos_pagar -q -p "Ano de Exercício=2026" -p "Mês - Numérico=2:12" -o datapackages/dados_siafi/data_raw/restos_pagar_02.csv
