name: dados_siafi
title: Sistema Integrado de Administração Financeira – SIAFI 2026
owner_org: secretaria-de-estado-de-planejamento-e-gestao-seplag
dpetl_load:
  owner: splor-mg
  repo: dados-siafi-2026
  level: orgs
resources:
  - name: alteracoes_orcamentarias
    type: table
    path: 'data_raw/alteracoes_orcamentarias.csv'
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    dialect: schemas/dialect.yaml
    schema: schemas/alteracoes_orcamentarias.yaml
    dpetl_extract:
      mode: cli
      arguments:
        - bo export AID-SPLOR/dados_siafi/current/alteracoes_orcamentarias -q --dp DP1 -p "Ano de Exercício=2026" -o datapackages/dados_siafi/data_raw/alteracoes_orcamentarias.csv

