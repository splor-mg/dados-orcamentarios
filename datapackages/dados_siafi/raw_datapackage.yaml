name: dados_siafi
title: Sistema Integrado de Administração Financeira – SIAFI {{year0}}
owner_org: secretaria-de-estado-de-planejamento-e-gestao-seplag
dpetl_load:
  owner: splor-mg
  repo: dados-siafi-{{year0}}
  level: orgs
  visibility: public
dpetl_linktable:
  resource_list:
    - alteracoes_orcamentarias
    - cota
    - credito
    - execucao
    - receita
    - restos_pagar

custom:
  - sources:
    - id: relatorios
      source: https://github.com/splor-mg/regras-orcamentarias-mg/tree/main/rules/DCAF/relatorios
  - flows:
    - id: receita
      description: "regras para aplicação nos recursos: receita"
      rules:
        - is_asps_rec
        - is_impostos
    - id: despesa
      description: "regras para aplicação nos recursos: execucao, cota, credito"
      rules:
        - is_asps_desp

resources:
  - name: alteracoes_orcamentarias
    type: table
    path: data_raw/alteracoes_orcamentarias.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema: schemas/alteracoes_orcamentarias.yaml
    dpetl_extract:
      mode: cli
      arguments:
        - bo export dados_siafi/current/alteracoes_orcamentarias -q --dp DP0 -p "Ano de Exercício={{year0}}" -o datapackages/dados_siafi/data_raw/alteracoes_orcamentarias.csv
    dpetl_transform:
      cli:
        stdin: true
        arguments:
          - zendt flow despesa -o datapackages/dados_siafi/data/alteracoes_orcamentarias.csv.gz

  - name: cota
    type: table
    path: data_raw/cota.csv
