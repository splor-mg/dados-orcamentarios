fields:

  - name: acao_cod
    type: string
    title: Ação - Código
    description: |
      Código identificador do conjunto de operações, limitadas no tempo (projeto) ou realizadas de modo contínuo e permanente (atividade)
      dos quais resulta um produto final (projeto) ou necessárias à manutenção da ação governamental (atividade).
    constraints:
      pattern: '^[1-9]\d{3}$'
    missingValues: ['0', '']

  - name: acao_desc
    type: string
    title: Ação - Descrição
    description: |
      Descrição do conjunto de operações, limitadas no tempo (projeto) ou realizadas de modo contínuo e permanente (atividade)
      dos quais resulta um produto final (projeto) ou necessárias à manutenção da ação governamental.
    constraints:
      maxLength: 500

