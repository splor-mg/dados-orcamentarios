name: dados_check_siafi
title: Validador do datapackage dados_siafi
dpetl_load:
  owner: splor-mg
  repo: dados-check-siafi
  level: orgs
  visibility: public

resources:
  - name: alteracoes_orcamentarias
    type: table
    path: data_raw/alteracoes_orcamentarias.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema: schemas/alteracoes_orcamentarias.yaml
    dpetl_extract:
      mode: cli
      arguments:
        - bo export dados_check_siafi/current/alteracoes_orcamentarias -q --dp DP0 -o datapackages/dados_check_siafi/data_raw/alteracoes_orcamentarias.csv
    dpetl_transform:
      format: csv

  - name: cota
