[project]
site_url = "https://splor-mg.github.io/dados-orcamentarios/"
site_name = "dados-orcamentarios"
site_description = "Orquestrador de ETL dos datapackages orçamentários da SPLOR-MG, construído sobre o dpetl."
site_author = "SPLOR-MG"

repo_url = "https://github.com/splor-mg/dados-orcamentarios"
repo_name = "splor-mg/dados-orcamentarios"
edit_uri = "edit/main/docs/"

nav = [
  { "Início" = "index.md" },
  { "Estrutura e Fluxo" = "estrutura.md" },
  { "Tasks" = [
    { "Resumo" = "tasks/tasks.md" },
    { "Pre Extract" = [
      { "Workflow" = "tasks/pre_extract/workflow.md" },
      { "Yaml" = "tasks/pre_extract/yaml.md" },
      { "Bocache" = "tasks/pre_extract/bocache.md" },
    ] },
    { "Extract" = "tasks/extract.md" },
    { "Transform" = "tasks/transform.md" },
    { "Pre Load" = "tasks/pre_load.md" },
    { "Load" = "tasks/load.md" },
  ] },
  { "Datapackages" = [
    { "Resumo" = "datapackages/datapackages.md" },
    { "Classificadores" = "datapackages/classificadores.md" },
    { "SIAFI" = "datapackages/siafi.md" },
    { "SIAD" = "datapackages/siad.md" },
    { "PPO" = "datapackages/ppo.md" },
  ] },
  { "Workflow" = "workflow.md" },
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "pt-BR"
features = [
  "announce.dismiss",
  "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.markdown_extensions.zensical.extensions.macros]
include_dir = "docs/templates"
on_error_fail = true
